d.innerHTML='<h3>アプリを起動できませんでした</h3><p>記録したデータは端末に残っています。次の順にお試しください。</p><p><button id="hr1" style="padding:10px 14px;margin:4px">① 再読み込み</button></p><p><button id="hr2" style="padding:10px 14px;margin:4px">② アプリを再取得して再起動（データは消えません）</button></p><p><button id="hr3" style="padding:10px 14px;margin:4px">③ 保存データをファイルに書き出す</button></p><p style="font-size:12px;color:#a00">'+(window.__hopeErr.slice(0,2).join(' / ')||'')+'</p>';document.body.appendChild(d);

document.getElementById('hr3').onclick=function(){try{var t=localStorage.getItem('dl')||'';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='hope_raw_backup_'+Date.now()+'.json';document.body.appendChild(a);a.click()}catch(e){alert('書き出せませんでした：'+e.message)}}}

<script>
const $=s=>$d.querySelector(s),$d=document;
const showErr=m=>{try{let b=document.getElementById('eb');if(!b){b=document.createElement('div');b.id='eb';b.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:50;background:#fde7e7;color:#a00;border:1px solid #d93b3b;border-radius:10px;padding:10px;font-size:12px';b.onclick=()=>b.remove();document.body.appendChild(b)}b.textContent='エラー: '+m+'（タップで閉じる）'}catch(x){}};

const lt=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S={p:[],a:[],m:[],g:[],team:'マイチーム',hide:0,cur:''},tab='home',sel='',mk=0,an={who:'',per:'fy',inc:0,ty:'x',tn:''},acm='',acg={s:'',e:''},rkp='',rk2={k:'',i:0},sq='',so='sc',gf=[],pf=[],gt='',gy=0,lim=10,rz=-1,pmode=0,ptc='',msg='',ca='',cb='',gp=0,gss='',warm=0,bki='',bkm='',bkt='',rpc={id:'',u:'',t:''},sh='',ip={},gq='',gk='',gli=0,gst=[],rid='';

S.p.forEach(p=>{if(p.g0==null){p.g0=0;p.fy=fyOf(lt())}p.kana=p.kana||''});
const norm=()=>{try{(S.p||[]).forEach(p=>{if(!p.dv)p.dv='代表'});(S.g||[]).forEach(g=>{if(!g.dv)g.dv='代表'})}catch(_){}S.tm=Object.assign({ab:'',cat:'沖縄ブロック',kind:'学童野球',rb:'',yr:fyOf(lt()),area:'',mgr:'',memo:'',pp:'1週間',lim:500,cons:'制限なし',nx:'',iv:3,r:{公式戦:{i:9,t:1,c:1},練習試合:{i:9,t:0,c:0},紅白戦:{i:9,t:0,c:0},その他:{i:9,t:0,c:0}}},S.tm);S.pt=S.pt||[];S.gl=S.gl||[];S.px=S.px||[];S.sb=S.sb||[];S.gd=S.gd||{};S.sn=S.sn||[];S.op=S.op||[];S.df=S.df||[];S.pk=S.pk||[];S.ao=S.ao||[];S.ev=S.ev||[];S.ob=S.ob||[];S.opp=S.opp||[];S.g.forEach(g=>{if(g.h&&g.hv!=2){g.h=[];g.hv=2}});S.gr=S.gr&&S.gr.length?S.gr:[{id:'gr0',name:'自校グラウンド',lf:98,lc:110,cf:122,rc:110,rf:98,bs:27.4,pm:18.4}];S.rs=S.rs&&S.rs.length?S.rs:[{id:'d0',name:'学童 標準',i:6,tb:0,c:1,dh:0,tl:0,ro:0,nt:''}];S.hh=S.hh||[];S.ho=S.ho||[];S.ux=Object.assign({mode:'d',btns:['1','2','3','H','K','B','G','F'],cf:1,vc:1,lk:0,dr:null,md:'',mk:'g'},S.ux);S.set=Object.assign({th:'',fs:100,cm:'C'},S.set)};norm();
// ===== Phase 1: データ保存の安全性 =====
const OPK='dl_log';let OPL=[];try{OPL=JSON.parse(localStorage.getItem(OPK)||'[]');if(!Array.isArray(OPL))OPL=[]}catch(_){OPL=[]}
const oplog=(a,x)=>{try{OPL.push({t:new Date().toISOString(),a,x:String(x==null?'':x).slice(0,80)});if(OPL.length>200)OPL=OPL.slice(-200);localStorage.setItem(OPK,JSON.stringify(OPL))}catch(_){}};
let IDBHOOK=null;const SV={ok:true,at:0,err:'',q:0,n:0},LSMAX=5000000;
const svEl=(id,css)=>{let b=document.getElementById(id);if(!b){b=document.createElement('div');b.id=id;b.style.cssText=css;document.body.appendChild(b)}return b};
const svBanner=(id,m,css)=>{try{const b=svEl(id,css);if(m){b.style.display='block';b.textContent=m}else b.style.display='none'}catch(_){}};

const lsUse=()=>{let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=k.length+(localStorage.getItem(k)||'').length}}catch(_){}return n};

const svFail=(why,quota)=>{const f=!SV.err;SV.ok=false;SV.err=why;SV.q=quota?1:0;svBanner('svb','⚠ 保存できていません：'+why+'。変更はまだこの端末に保存されていません。「チーム」画面の「データ」でバックアップを書き出してください。','position:fixed;left:8px;right:8px;top:8px;z-index:60;background:#fde7e7;color:#a00;border:1px solid #d93b3b;border-radius:10px;padding:10px;font-size:12px;line-height:1.5');tpill('保存に失敗しました',1);if(f)oplog('保存失敗',why);return false};

s10Reset();SY10.bind=nb;yHist({kind:'設定',ok:1,note:(/退避/.test(ch)?'端末データを退避してチーム「':'端末データを引き継いでチーム「')+t.name+'」に接続'});await ySaveNow();return true};
const s10MyTeams=async()=>{c10.teams=await clCall('my_teams');return c10.teams};

/* --- 競合の比較・解決 --- */
const s10Pv=v=>v===undefined?'（なし）':v===null?'null':typeof v=='object'?JSON.stringify(v).slice(0,120):String(v);
const s10Flat=(d)=>{const v=d&&d.v!==undefined&&Object.keys(d).length==1?d.v:d;return v&&typeof v=='object'&&!Array.isArray(v)?v:{'（値）':v}};
const s10FieldDiff=(a,b)=>{const A=s10Flat(a),B=s10Flat(b),ks=[...new Set([...Object.keys(A||{}),...Object.keys(B||{})])];return ks.map(k=>({k,a:(A||{})[k],b:(B||{})[k],diff:sj((A||{})[k])!==sj((B||{})[k])}))};
const s10Local=k=>s10Recs().get(k);
const s10Fin=async(msg)=>{try{norm()}catch(_){}try{save()}catch(_){}yHist({kind:'競合解決',ok:1,note:msg});await ySaveNow();try{draw()}catch(_){}return s10Sync(true)};
const s10ResRec=async(cid,mode,picks)=>{const c=SY10.conf.find(x=>x.id==cid);if(!c)return;const r=c.remote,L=s10Local(c.key);
if(mode=='theirs'){if(r.deleted)s10Del(c.coll,c.rid);else s10Put(c.coll,c.rid,r.data);s10SetBase(c.key,r);s10Order([c.coll]);const cur=s10Recs();if(SY10.base[c.key]&&cur.has(c.key))SY10.base[c.key].h=cur.get(c.key).h}
else{let nd=null;if(mode=='merge'&&L&&!r.deleted){const A=JSON.parse(JSON.stringify(L.data)),flat=A&&A.v!==undefined&&Object.keys(A).length==1&&typeof A.v=='object'&&A.v&&!Array.isArray(A.v),T=flat?A.v:A,B=s10Flat(r.data);Object.keys(picks||{}).forEach(k=>{if(picks[k]=='theirs'){if(B[k]===undefined)delete T[k];else T[k]=JSON.parse(JSON.stringify(B[k]))}});nd=A}
if(nd)s10Put(c.coll,c.rid,nd);SY10.base[c.key]={h:'~',rev:r.rev,seq:r.seq,ord:r.ord==null?null:r.ord,grp:r.grp||null}}
SY10.conf=SY10.conf.filter(x=>x.id!=cid);return s10Fin('項目の競合を解決（'+(mode=='theirs'?'クラウドを採用':mode=='merge'?'項目ごとに選択':'この端末を採用')+'）')};
const s10ResGame=async(grp,mode)=>{const h=SY10.hold[grp];if(!h)return;const rows=Object.values(h.rows);
if(mode=='theirs'){const ok=await bkMake('sync','試合の競合を解決する前');if(!ok){showErr('バックアップを作れなかったため中止しました');return}
const recs=s10Recs();recs.forEach(r=>{if(r.grp==grp&&!SY10.base[r.k]){s10Del(r.coll,r.rid)}});
const co=new Set();rows.forEach(row=>{const k=row.coll+'|'+row.rid;if(row.deleted)s10Del(row.coll,row.rid);else s10Put(row.coll,row.rid,row.data);s10SetBase(k,row);co.add(row.coll)});s10Order([...co]);try{norm()}catch(_){}const cur=s10Recs();rows.forEach(row=>{const k=row.coll+'|'+row.rid;if(SY10.base[k]&&cur.has(k))SY10.base[k].h=cur.get(k).h})}
else{const recs=s10Recs();rows.forEach(row=>{const k=row.coll+'|'+row.rid,L=recs.get(k);if(row.deleted&&!L){delete SY10.base[k];return}SY10.base[k]={h:'~',rev:row.rev,seq:row.seq,ord:row.ord==null?null:row.ord,grp};if(!L&&!row.deleted){/* この端末に無い＝端末の内容では削除済み → 削除を送る */}})}
delete SY10.hold[grp];SY10.conf=SY10.conf.filter(x=>!(x.type=='game'&&x.grp==grp));return s10Fin('試合の競合を解決（'+(mode=='theirs'?'クラウドを採用・端末の追加分は退避':'この端末を採用')+'）')};
const s10GameCmp=grp=>{const h=SY10.hold[grp]||{rows:{}},recs=s10Recs(),per={};const bump=(c,f)=>{(per[c]=per[c]||{la:0,lm:0,ld:0,ra:0,rm:0,rd:0})[f]++};
recs.forEach(r=>{if(r.grp!=grp)return;const b=SY10.base[r.k];if(!b)bump(r.coll,'la');else if(b.h!==r.h)bump(r.coll,'lm')});Object.keys(SY10.base).forEach(k=>{const b=SY10.base[k];if(b.grp==grp&&!recs.has(k))bump(k.split('|')[0],'ld')});
Object.values(h.rows).forEach(w=>{const k=w.coll+'|'+w.rid;if(w.deleted)bump(w.coll,'rd');else if(SY10.base[k])bump(w.coll,'rm');else bump(w.coll,'ra')});
const gl=recs.get('g|'+grp),gr=h.rows['g|'+grp];return{per,fields:gl&&gr&&!gr.deleted?s10FieldDiff(gl.data,gr.data):null,gl:gl&&gl.data,gr:gr&&!gr.deleted?gr.data:null,grDel:gr&&gr.deleted}};
