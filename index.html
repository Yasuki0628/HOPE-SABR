const alerts=()=>{const t=S.tm,d=t.pp=='1日'?1:7,o=[];act().forEach(p=>{const n=pcnt(p.id,d);if(n>=t.lim*.8)o.push(p.name+' の球数が'+(n>=t.lim?'上限超過':'上限間近')+' ('+n+'/'+t.lim+'球)')});if(t.nx){const k=Math.round((new Date(t.nx)-new Date(lt()))/864e5);if(k<=7)o.push(k<0?'測定の予定日を過ぎています ('+t.nx+')':'測定の予定日まであと'+k+'日 ('+t.nx+')')}return o};
const al=()=>{const o=alerts();return o.length?`<div class="c" style="border-color:#d98a00"><b>🔔 お知らせ ${o.length}</b>${o.map(x=>`<div class="m">${esc(x)}</div>`).join('')}</div>`:''};

const topics=()=>{const o=[];act().forEach(p=>{const ds=[...new Set(S.m.filter(x=>x.p==p.id).map(x=>x.d))].sort();if(ds.length<2)return;const a=score(p.id,lt()),b=score(p.id,ds[ds.length-2]);if(a&&b&&a.s>b.s&&rk(a.s)!=rk(b.s))o.push(`<div class="i"><span>${esc(pn(p.id))}</span><span style="flex:0 0 auto">総合${rk(b.s)}${b.s} → ${rk(a.s)}${a.s} <i class="u">ランクUP</i></span></div>`)});return o.length?`<h3>成長トピック</h3><div class="c">${o.slice(0,3).join('')}</div>`:''};

gls:()=>`<button class="x" data-t="team">‹ チーム</button><h2 style="margin:4px 0 8px">用語集</h2><div class="c"><input id="gqi" placeholder="指標名・キーワードで検索" value="${esc(gq)}"></div><div class="ch"><button class="${gk?'':'on'}" data-a="gkc" data-k="">すべて</button>${GC.map(c=>`<button class="${gk==c?'on':''}" data-a="gkc" data-k="${c}">${c}</button>`).join('')}</div><p class="m">↑ 高いほど良い　↓ 低いほど良い　⇄ 打者と投手で見方が逆</p><div id="gll">${gla()}</div>`,
gld:()=>{const x=GL[gli];if(!x)return'';const D=DT[x.c+'/'+x.t]||DT[x.t]||{},k=RN.indexOf(x.t),DR={u:['↑','高いほど良い','数値が上がると ▲ 緑（改善）で表示します。'],d:['↓','低いほど良い','数値が下がると ▼ 緑（改善）で表示します。']},bd=BD[x.t]||'u',od=bd=='u'?'d':'u',rows=x.d=='b'?[['打者は'+DR[bd][1],DR[bd][0],DR[bd][2],1],['投手は'+DR[od][1],DR[od][0],DR[od][2],0]]:x.d?[[DR[x.d][1],DR[x.d][0],DR[x.d][2],1]]:[['高低で良し悪しを決めない','⇄','増減は灰色で表示し、目安の範囲で判断します。',0]];let f=D.f,y=D.y,m=D.m;
if(k>=0){y=U[k];f='60 ＋ 10 × (測定値 − 学年・性別の平均) ÷ 標準偏差'+(LW[k]?'（タイムは小さいほど高得点）':'');m='学童の平均（小1→小6） 男子: '+REF.男子[x.t].join('・')+U[k]+' ／ 女子: '+REF.女子[x.t].join('・')+U[k]}
const hh=TH[x.t]?th(x.t):null;if(hh)m=hh.g!=null?'良い: '+nf(hh.g,hh)+(hh.d=='u'?'以上':'以下')+(hh.b!=null?'・課題: '+nf(hh.b,hh)+(hh.d=='u'?'未満':'超'):'')+'。':'目安は設定されていません。';const mm=m?m+(!hh&&/高校|中学|^\.|%|前後|一般的/.test(m)?'　学童の目安は設けていません。':''):'目安は設けていません。チームの推移や前期間との比較で見てください。',bk=gst.length>1?GL[gst[gst.length-2]].t:'用語集',oth=GL.filter(z=>z.c==x.c&&z!=x).slice(0,6);
return`<button class="x" data-a="glb">‹ ${esc(bk)}</button><h2 style="margin:4px 0 8px">${esc(x.t)}</h2><div class="c"><span class="tag">${x.c}</span>${y?`<span class="tag">表示: ${esc(y)}</span>`:''}<p style="font-size:17px;margin-bottom:0">${esc(x.x)}</p></div>${f?`<div class="c"><b>▦ 計算式</b><div class="fm">${esc(f)}</div></div>`:''}<div class="c"><b>↗ 良い方向</b>${x.d=='b'?'<details style="display:inline-block;margin-left:8px"><summary class="m">ⓘ</summary><small class="m">同じ指標でも、打者として見るか投手として見るかで、良い方向が逆になります。</small></details>':''}${rows.map((r,i)=>`<div class="r" style="align-items:center;margin-top:8px;${i?'border-top:1px solid var(--b);padding-top:8px':''}"><span class="dr${r[3]?' g':''}">${r[1]}</span><span style="flex:1"><b>${r[0]}</b><br><small class="m">${r[2]}</small></span></div>`).join('')}</div><div class="c"><b>◎ 目安</b><p style="margin-bottom:0">${esc(mm)}</p>${hh?`<details style="margin-top:8px"><summary class="m">目安を編集</summary><div class="r" style="margin-top:8px"><label>良い（${hh.d=='u'?'以上':'以下'}${hh.p?'・%':''}）<input id="thg" type="number" step="any" inputmode="decimal" value="${hh.g==null?'':hh.g}"></label><label>課題（${hh.d=='u'?'未満':'超'}）<input id="thb" type="number" step="any" inputmode="decimal" value="${hh.b==null?'':hh.b}"></label></div><button class="p" data-a="thsave" data-k="${esc(x.t)}">保存</button><button class="x" data-a="thclr" data-k="${esc(x.t)}">目安をなしにする</button><button class="x" data-a="thrst" data-k="${esc(x.t)}">初期値に戻す</button><p class="m">この目安は、分析の「良い／課題」の表示に使われます。初期値は参考値（中学）です。学童に合わせて直してください。</p></details>`:''}</div>${k>=0?`<div class="c"><b>測定方法の目安</b><p class="m" style="margin-bottom:0">${esc(MH[k])}</p></div>`:''}<p class="m" style="margin:6px 4px">このアプリでの集計: ${OK.includes(x.t)?'対応しています':'まだ対応していません'}</p><h3>${x.c}のほかの指標</h3><div class="c">${oth.map(z=>`<div class="i" data-a="gld" data-i="${GL.indexOf(z)}"><span><b>${esc(z.t)}</b><br><small class="m">${esc(z.x)}</small></span><span class="m" style="flex:0 0 auto">›</span></div>`).join('')}</div>`},
gl:()=>`<button class="x" data-t="ana">‹ 分析</button><div class="c w"><table><tr><th>試合</th><th>結果</th><th>打数-安打</th><th>四死</th><th>三振</th><th>球数</th></tr>${S.g.slice().sort((a,b)=>a.d<b.d?1:-1).map(g=>{const s=st(S.a.filter(x=>x.gid==g.id));return`<tr data-a="gd" data-i="${g.id}"><td>${dj(g.d)} ${esc(g.o||'')}</td><td>${g.rs}-${g.ra}</td><td>${s.ab}-${s.h}</td><td>${s.bb+s.hbp}</td><td>${s.k}</td><td>${S.pt.filter(x=>x.gid==g.id&&x.p).length}</td></tr>`}).join('')}</table></div>`,
allm:()=>{const a=ts(pg(an.per,0),''),b=ts(pg(an.per,1),''),X=[['打席',x=>x.pa],['打数',x=>x.ab],['安打',x=>x.h],['本塁打',x=>x.hr],['打点',x=>x.rbi],['四球',x=>x.bb],['死球',x=>x.hbp],['犠打',x=>x.sh],['犠飛',x=>x.sf],['三振',x=>x.k],['長打率',x=>x.slg,f3],...CD.map(c=>[c[0],c[1],c[3]])];
return`<button class="x" data-t="ana">‹ 分析</button>${chips()}<div class="c w"><table><tr><th>指標</th><th>今期</th><th>前期</th></tr>${X.map(([n,f,fm])=>{const g=fm||(x=>x);return`<tr><td>${n}</td><td>${isFinite(f(a))?g(f(a)):'-'}${jb(CMAP[n]||n,f(a))}</td><td>${isFinite(f(b))?g(f(b)):'-'}</td></tr>`}).join('')}</table></div>`},
ax:()=>{const r=act().map(p=>{const q=[];M.forEach((m,k)=>{const v=lat(p.id,k,'9999');if(v!=null){const z=ms(p.id,k,v,lt());if(z!=null)q.push(z)}});const s=st(S.a.filter(x=>x.p==p.id&&fyOf(x.d)==fyOf(lt())));return q.length>=3&&s.pa>=10&&isFinite(s.ops)?{p,a:Math.round(q.reduce((x,y)=>x+y)/q.length),f:Math.round(cl(s.ops*100))}:null}).filter(Boolean).map(x=>({...x,d:x.f-x.a})),row=x=>`<div class="i" data-a="pd" data-i="${x.p.id}"><span>${esc(pn(x.p.id))}</span><span style="flex:0 0 auto">能力${x.a} 実戦${x.f} <i class="${x.d>0?'u':'d'}">${x.d>0?'+':''}${x.d}</i></span></div>`,u=r.filter(x=>x.d>=15),g=r.filter(x=>x.d<=-15);
return`<button class="x" data-t="ana">‹ 分析</button><div class="c"><b>能力以上の結果 ${u.length}人</b><p class="m">実戦(OPS)が能力(測定)を15点以上上回る選手</p>${u.map(row).join('')}</div><div class="c"><b>伸びしろ ${g.length}人</b><p class="m">能力に対して実戦が15点以上低い選手（測定3項目・10打席以上が対象）</p>${g.map(row).join('')}</div>`},
cmp:()=>{const P=act(),A=P.find(p=>p.id==ca)||P[0],B=P.find(p=>p.id==cb)||P[1]||P[0];if(!A)return none;const row=(n,f)=>`<tr><td>${n}</td><td>${f(A)}</td><td>${f(B)}</td></tr>`,sa=p=>st(S.a.filter(x=>x.p==p.id&&fyOf(x.d)==fyOf(lt())));
return`<button class="x" data-t="pls">‹ 選手一覧</button><div class="c"><div class="r"><label>A<select id="c1">${opts(P.map(p=>[p.id,pn(p.id)]),A.id)}</select></label><label>B<select id="c2">${opts(P.map(p=>[p.id,pn(p.id)]),B.id)}</select></label></div></div><div class="c w"><table>${row('総合',p=>{const c=score(p.id,lt());return c?rk(c.s)+c.s:'-'})}${M.map((m,k)=>row(m[0],p=>{const v=lat(p.id,k,'9999');return v==null?'-':v+m[1]})).join('')}${row('打率',p=>f3(sa(p).avg))}${row('OPS',p=>f3(sa(p).ops))}${row('打点',p=>sa(p).rbi)}</table></div>`},
pk:()=>{const p=S.p.find(x=>x.id==sel);if(!p)return'';const rows=M.map((m,k)=>{const l=S.m.filter(x=>x.p==p.id&&x.k==k&&!x.na).sort((a,b)=>a.d<b.d?-1:1);if(!l.length)return'';const v=l.map(x=>x.v),b=m[2]?Math.min(...v):Math.max(...v),g=+(v[v.length-1]-v[0]).toFixed(2),good=m[2]?g<0:g>0;return`<div class="i"><span><b>${m[0]}</b><br><small class="m">最新 ${v[v.length-1]}${m[1]}・自己ベスト ${b}${m[1]}</small></span>${l.length>1?`<span style="flex:0 0 auto;color:${good?'#1a9e5c':'var(--m)'}">${g>0?'+':''}${g}</span>`:'<small class="m">はじめて</small>'}</div>`}).join('');
return`<button class="x" data-t="pd">‹ 戻る</button><div class="c" style="text-align:center"><h2 style="margin:4px 0">${esc(p.name)} さん</h2><p class="m">きのうの自分より、すこしずつ前へ！</p></div><div class="c"><b>わたしの記録</b>${rows||'<p class="m">まだ測定がありません</p>'}<p class="m">数字は最初の記録からの変化です。体の成長には個人差があるので、友だちとくらべすぎなくて大丈夫。痛いところや具合が悪いときは、すぐに大人に伝えよう。</p></div>`},
rp:()=>{const p=S.p.find(x=>x.id==sel);if(!p)return'';const hit=rpc.id==p.id&&rpc.t==pst.rp&&rpc.u;if(!hit)setTimeout(()=>{const ty=pst.rp;renderReport(p.id,ty).then(u=>{rpc={id:p.id,u,t:ty};const i=$('#rpi');if(i){i.src=u;i.style.opacity=1}const m=$('#rpm');if(m)m.textContent='作成しました。画像を長押しして保存するか、下のボタンを使ってください。'}).catch(e=>showErr('レポートの作成に失敗しました: '+e.message))},30);
return`<button class="x np" data-t="pd">‹ 選手詳細</button><h2 class="np" style="margin:4px 0 8px">レポート画像</h2><div class="ch np">${pdt('b','打者用','rp')}${pdt('p','投手用','rp')}</div><p class="m np" id="rpm">${hit?'作成しました。画像を長押しして保存するか、下のボタンを使ってください。':'作成中…（数秒かかります）'}</p><img id="rpi" alt="能力レポート" style="width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.15);opacity:${hit?1:.3}" src="${hit?rpc.u:'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}"><div class="r np" style="margin-top:10px"><button class="p" style="margin:0" data-a="rpdl">画像を保存（PNG）</button><button style="flex:1" data-a="rpprint">印刷／PDF</button></div><p class="m np">A4縦・2480×3508px のPNGです。打者用は打撃・対左右・打球・カウント別打率、投手用は投球内容・被打球・カウント別被打率を載せます。保存できないときは、画像を長押ししてください。</p>`},
mse:()=>`<button class="x" data-t="home">‹ ホーム</button><div class="c"><b>測定会（まとめて入力）</b><div class="r"><label>項目<select id="mk">${opts(M.map((m,i)=>[i,m[0]+' ('+m[1]+')']),mk)}</select></label><label>日付<input id="dt" type="date" value="${lt()}"></label></div></div><div class="c">${act().map(p=>`<div class="r" style="align-items:center;margin-bottom:6px"><span style="flex:1">${esc(pn(p.id))}</span><input style="flex:0 0 110px" id="ms_${p.id}" type="number" step="any" inputmode="decimal" placeholder="${lat(p.id,mk,'9999')==null?'':lat(p.id,mk,'9999')}"></div>`).join('')||'<span class="m">先に選手を登録してください</span>'}<button class="p" data-a="msave">保存</button></div>`,

team:()=>{norm();opSync();const t=S.tm,P=act(),n=P.length,c=x=>P.filter(p=>p.pos&&x.includes(p.pos[0])).length,y=fyOf(lt()),w=S.g.filter(g=>fyOf(g.d)==y),W=w.filter(g=>g.rs>g.ra).length,Lo=w.filter(g=>g.rs<g.ra).length,sb='<button class="p" data-a="tn">保存</button>',BL=['沖縄ブロック','うるまブロック','嘉手納読谷ブロック','北部南ブロック','北部北ブロック','中部南ブロック','那覇ブロック','島尻ブロック','宮古ブロック','八重山ブロック'];

<div class="c"><b>チーム情報</b><label>チームロゴ（画像を選ぶ）<input id="lgf" type="file" accept="image/*"></label><button class="x" data-a="lgr">初期のロゴに戻す</button><label>チーム名 (1〜60文字)<input id="tn" maxlength="60" value="${esc(S.team)}"></label><div class="r"><label>略称<input id="tab" maxlength="10" value="${esc(t.ab)}"></label><label>年度<input id="tyr" type="number" min="1900" max="2200" value="${t.yr}"></label></div><label>カテゴリー<select id="tkd">${opts(Object.keys(KS).map(x=>[x,x]),t.kind)}</select></label><label>評価基準の性別の扱い<select id="trb">${opts([['','回答した性別の基準を使う（未回答は男女共通）'],['共通','常に男女共通の基準を使う']],t.rb)}</select></label><label>区分<select id="tct">${opts(BL.map(x=>[x,x]),t.cat)}</select></label><div class="r"><label>地域<input id="tar" maxlength="40" value="${esc(t.area)}"></label><label>担当者<input id="tmg" maxlength="40" value="${esc(t.mgr)}"></label></div><label>メモ (300文字まで)<textarea id="tme" maxlength="300">${esc(t.memo)}</textarea></label>${sb}</div>
